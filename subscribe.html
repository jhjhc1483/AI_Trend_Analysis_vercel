<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe | AI Trend Analyzer</title>
    <style>
        :root {
            --primary-color: #471c87;
            --secondary-color: #3498db;
            --success-color: #2ea44f;
            --danger-color: #e74c3c;
            --bg-color: #f4f4f9;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-color);
        }

        .subscribe-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
            color: #555;
        }

        input[type="email"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
            outline: none;
        }

        input[type="email"]:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-subscribe {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-subscribe:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-unsubscribe {
            background-color: transparent;
            color: var(--danger-color);
            border: 2px solid var(--danger-color);
        }

        .btn-unsubscribe:hover {
            background-color: var(--danger-color);
            color: white;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.2);
        }

        .btn-back {
            margin-top: 20px;
            background: none;
            color: #888;
            font-size: 0.9em;
            text-decoration: underline;
            border: none;
            padding: 5px;
            width: auto;
            display: inline-block;
        }

        .btn-back:hover {
            color: var(--text-color);
        }

        #status-msg {
            margin-top: 20px;
            font-size: 0.9em;
            font-weight: 500;
            min-height: 1.2em;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>
    <div class="subscribe-container">
        <p id="intro-text">AI 일일 동향 리포트를<br>이메일로 받아보세요. (무료)</p>
        <p id="intro-note" style="font-size: 0.8rem; color: #888; margin-top: -20px; margin-bottom: 25px;">
            * 개인정보 보호를 위해 구독은 1년간 유지되며, 만료 2주 전부터 메일로 연장 안내를 드립니다.<br>
            * 메일이 오지 않는 경우 스팸 메일함을 확인해 주세요.
        </p>
        
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="example@email.com" required>
        </div>

        <div class="button-group">
            <button id="subscribeBtn" class="btn-subscribe">
                <span class="loader" id="subLoader"></span>
                구독하기
            </button>
            <button id="unsubscribeBtn" class="btn-unsubscribe">
                <span class="loader" id="unsubLoader"></span>
                구독취소
            </button>
            <!-- 메일 속 해지/연장 링크로 들어왔을 때만 보이는 확인 버튼 -->
            <button id="linkActionBtn" class="btn-subscribe" style="display: none;">
                <span class="loader" id="linkLoader"></span>
                <span id="linkActionLabel"></span>
            </button>
        </div>

        <div id="status-msg"></div>

        <button onclick="location.href='index.html'" class="btn-back">Back to Home</button>
        
        <div style="margin-top: 30px; font-size: 0.85em; color: #aaa;">
            &copy; Maj.Cjh. All rights reserved.
        </div>
    </div>

    <script>
        // 구독자 목록은 서버(/api/subscribe)에서만 읽고 씁니다. 브라우저는 이메일 한 건만 보냅니다.
        async function requestSubscription(email, action, token) {
            const res = await fetch('/api/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, action, ...(token && { token }) })
            });
            const data = await res.json().catch(() => ({}));
            if (!data.status) {
                throw new Error(data.message || `HTTP Error ${res.status}`);
            }
            return data; // { status, message }
        }

        // 응답 상태별 안내 문구 색상
        const STATUS_COLORS = {
            subscribed: "var(--success-color)",
            already: "var(--secondary-color)",
            full: "var(--danger-color)",
            unsubscribed: "var(--text-color)",
            not_found: "var(--danger-color)",
            renewed: "var(--success-color)",
            bad_token: "var(--danger-color)",
            closed: "var(--danger-color)",
        };

        // 신규 구독 신청 받기 여부 (api/subscribe.js 의 SUBSCRIBE_OPEN 과 같게 유지)
        const SUBSCRIBE_OPEN = false;
        // 메일 속 해지/연장 링크로 들어온 경우(?action=...)는 아래 링크 처리 화면을 그대로 사용
        if (!SUBSCRIBE_OPEN && !new URLSearchParams(location.search).get('action')) {
            document.getElementById('subscribeBtn').style.display = 'none';
            document.getElementById('intro-text').innerHTML = '신규 구독 신청을<br>잠시 중단했습니다.';
            document.getElementById('intro-note').textContent =
                '* 기존 구독자는 아래에 이메일을 입력하고 [구독취소]를 누르거나, 메일 하단의 링크로 해지할 수 있습니다.';
        }

        const emailInput = document.getElementById('email');
        const statusMsg = document.getElementById('status-msg');
        const subBtn = document.getElementById('subscribeBtn');
        const unsubBtn = document.getElementById('unsubscribeBtn');
        const subLoader = document.getElementById('subLoader');
        const unsubLoader = document.getElementById('unsubLoader');

        function setStatus(msg, color) {
            statusMsg.textContent = msg;
            statusMsg.style.color = color;
        }

        async function handleAction(action) {
            const email = emailInput.value.trim();
            if (!email || !email.includes('@')) {
                setStatus("유효한 이메일을 입력해주세요.", "var(--danger-color)");
                return;
            }

            const loader = action === 'Subscribe' ? subLoader : unsubLoader;
            const btn = action === 'Subscribe' ? subBtn : unsubBtn;
            
            try {
                btn.disabled = true;
                loader.style.display = 'inline-block';
                setStatus(`${action === 'Subscribe' ? '구독' : '해지'} 처리 중...`, "var(--secondary-color)");

                const result = await requestSubscription(email, action === 'Subscribe' ? 'subscribe' : 'unsubscribe');
                setStatus(result.message, STATUS_COLORS[result.status] || "var(--text-color)");
                if (result.status === 'subscribed' || result.status === 'unsubscribed') {
                    emailInput.value = '';
                }
            } catch (err) {
                console.error(err);
                setStatus("처리 중 오류가 발생했습니다: " + err.message, "var(--danger-color)");
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        subBtn.addEventListener('click', () => handleAction('Subscribe'));
        unsubBtn.addEventListener('click', () => handleAction('Unsubscribe'));

        // ---- 메일 속 링크(?action=unsubscribe|renew&email=...&token=...)로 들어온 경우 ----
        // 메일 보안 검사기가 링크를 미리 열어도 처리되지 않도록, 자동 실행하지 않고 확인 버튼을 누르게 합니다.
        const params = new URLSearchParams(location.search);
        const linkAction = params.get('action');
        const linkEmail = params.get('email');
        const linkToken = params.get('token');
        const LINK_LABELS = {
            unsubscribe: { button: '구독 해지 확인', prompt: '아래 버튼을 누르면 구독이 해지됩니다.', color: 'var(--danger-color)' },
            renew: { button: '1년 연장하기', prompt: '아래 버튼을 누르면 구독이 오늘부터 1년 연장됩니다.', color: 'var(--secondary-color)' },
        };
        if (LINK_LABELS[linkAction] && linkEmail && linkToken) {
            const label = LINK_LABELS[linkAction];
            const linkBtn = document.getElementById('linkActionBtn');
            const linkLoader = document.getElementById('linkLoader');
            emailInput.value = linkEmail;
            emailInput.readOnly = true;
            subBtn.style.display = 'none';
            unsubBtn.style.display = 'none';
            linkBtn.style.display = '';
            if (linkAction === 'unsubscribe') linkBtn.className = 'btn-unsubscribe';
            document.getElementById('linkActionLabel').textContent = label.button;
            setStatus(label.prompt, label.color);

            linkBtn.addEventListener('click', async () => {
                try {
                    linkBtn.disabled = true;
                    linkLoader.style.display = 'inline-block';
                    setStatus('처리 중...', "var(--secondary-color)");
                    const result = await requestSubscription(linkEmail, linkAction, linkToken);
                    setStatus(result.message, STATUS_COLORS[result.status] || "var(--text-color)");
                    if (result.status === 'unsubscribed' || result.status === 'renewed') {
                        linkBtn.style.display = 'none';
                    }
                } catch (err) {
                    console.error(err);
                    setStatus("처리 중 오류가 발생했습니다: " + err.message, "var(--danger-color)");
                } finally {
                    linkBtn.disabled = false;
                    linkLoader.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
