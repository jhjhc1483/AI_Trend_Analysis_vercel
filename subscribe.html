<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe | AI Trend Analyzer</title>
    <style>
        :root {
            --primary-color: #471c87;
            --secondary-color: #3498db;
            --telegram-color: #0088cc;
            --success-color: #2ea44f;
            --danger-color: #e74c3c;
            --bg-color: #f4f4f9;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0088cc 0%, #471c87 100%);
            color: var(--text-color);
            transition: background 0.5s ease;
        }

        .subscribe-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tabs {
            display: flex;
            background: #eee;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9em;
            transition: all 0.3s;
            color: #777;
        }

        .tab.active {
            background: white;
            color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2em;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
            font-size: 0.95em;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
            color: #555;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button.action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-subscribe {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-subscribe:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-unsubscribe {
            background-color: transparent;
            color: var(--danger-color);
            border: 2px solid var(--danger-color);
        }

        .btn-unsubscribe:hover {
            background-color: var(--danger-color);
            color: white;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.2);
        }

        .btn-back {
            margin-top: 20px;
            background: none;
            color: #888;
            font-size: 0.9em;
            text-decoration: underline;
            border: none;
            padding: 5px;
            width: auto;
            display: inline-block;
            cursor: pointer;
        }

        .btn-back:hover {
            color: var(--text-color);
        }

        #status-msg {
            margin-top: 20px;
            font-size: 0.9em;
            font-weight: 500;
            min-height: 1.2em;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>
    <div class="subscribe-container">
        <div class="tabs">
            <div id="tab-telegram" class="tab active" onclick="setMode('Telegram')">Telegram</div>
            <div id="tab-email" class="tab" onclick="setMode('Email')">Email</div>
        </div>

        <h1 id="title">Subscribe</h1>
        <p id="description">AI 일일 동향 리포트를<br>텔레그램으로 받아보세요.</p>
        
        <div class="input-group">
            <label id="input-label" for="subscriber-id">Telegram Chat ID</label>
            <input type="text" id="subscriber-id" placeholder="Chat ID를 입력하세요" required>
        </div>

        <div class="button-group">
            <button id="subscribeBtn" class="action-btn btn-subscribe">
                <span class="loader" id="subLoader"></span>
                구독하기
            </button>
            <button id="unsubscribeBtn" class="action-btn btn-unsubscribe">
                <span class="loader" id="unsubLoader"></span>
                구독취소
            </button>
        </div>

        <div id="status-msg"></div>

        <button onclick="location.href='index.html'" class="btn-back">Back to Home</button>
        
        <div style="margin-top: 30px; font-size: 0.85em; color: #aaa;">
            &copy; Maj.Cjh. All rights reserved.
        </div>
    </div>

    <script>
        const OWNER = "jhjhc1483";
        const REPO = "AI_Trend_Analysis_vercel";
        const BRANCH = "main";
        
        let currentMode = 'Telegram'; // Default mode

        const modes = {
            Telegram: {
                path: "codes/receiver_telegram.json",
                label: "Telegram Chat ID",
                placeholder: "Chat ID를 입력하세요",
                desc: "AI 일일 동향 리포트를<br>텔레그램으로 받아보세요.",
                bg: "linear-gradient(135deg, #0088cc 0%, #471c87 100%)"
            },
            Email: {
                path: "codes/receiver_email.json",
                label: "Email Address",
                placeholder: "example@email.com",
                desc: "AI 일일 동향 리포트를<br>이메일로 받아보세요.",
                bg: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)"
            }
        };

        function setMode(mode) {
            currentMode = mode;
            
            // Update UI
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${mode.toLowerCase()}`).classList.add('active');
            
            document.getElementById('input-label').textContent = modes[mode].label;
            document.getElementById('subscriber-id').placeholder = modes[mode].placeholder;
            document.getElementById('description').innerHTML = modes[mode].desc;
            document.body.style.background = modes[mode].bg;
            
            // Clear status and input
            document.getElementById('status-msg').textContent = '';
            document.getElementById('subscriber-id').value = '';
        }

        async function callProxyAPI(endpoint, method = 'GET', body = null) {
            const res = await fetch('/api/github', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ endpoint, method, body })
            });
            if (!res.ok && res.status !== 404) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.message || `HTTP Error ${res.status}`);
            }
            if (res.status === 204) return null;
            if (res.status === 404) return null;
            return await res.json();
        }

        function base64ToUtf8(base64) {
            try {
                const binary = atob(base64.replace(/\n/g, ""));
                const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
                return new TextDecoder("utf-8").decode(bytes);
            } catch (e) {
                console.error("Base64 decoding error:", e);
                return "[]";
            }
        }

        function utf8ToBase64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        async function getDataList() {
            const path = modes[currentMode].path;
            const endpoint = `repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;
            const data = await callProxyAPI(endpoint, 'GET');
            if (!data) return { items: [], sha: null };
            
            const content = base64ToUtf8(data.content);
            return {
                items: JSON.parse(content),
                sha: data.sha
            };
        }

        async function updateDataList(items, sha, action, target) {
            const path = modes[currentMode].path;
            const endpoint = `repos/${OWNER}/${REPO}/contents/${path}`;
            const jsonString = JSON.stringify(items, null, 2);
            const body = {
                message: `${action} ${currentMode}: ${target}`,
                content: utf8ToBase64(jsonString),
                branch: BRANCH
            };
            if (sha) body.sha = sha;

            await callProxyAPI(endpoint, 'PUT', body);
        }

        const inputField = document.getElementById('subscriber-id');
        const statusMsg = document.getElementById('status-msg');
        const subBtn = document.getElementById('subscribeBtn');
        const unsubBtn = document.getElementById('unsubscribeBtn');
        const subLoader = document.getElementById('subLoader');
        const unsubLoader = document.getElementById('unsubLoader');

        function setStatus(msg, color) {
            statusMsg.textContent = msg;
            statusMsg.style.color = color;
        }

        async function handleAction(action) {
            const val = inputField.value.trim();
            if (!val) {
                setStatus(`${currentMode === 'Email' ? '이메일' : 'Chat ID'}을 입력해주세요.`, "var(--danger-color)");
                return;
            }

            const loader = action === 'Subscribe' ? subLoader : unsubLoader;
            const btn = action === 'Subscribe' ? subBtn : unsubBtn;
            
            try {
                btn.disabled = true;
                loader.style.display = 'inline-block';
                setStatus(`${action === 'Subscribe' ? '구독' : '해지'} 처리 중...`, "var(--secondary-color)");

                const { items, sha } = await getDataList();
                
                if (action === 'Subscribe') {
                    if (items.includes(val)) {
                        setStatus(`이미 등록된 ${currentMode === 'Email' ? '이메일' : 'ID'}입니다.`, "var(--secondary-color)");
                    } else {
                        items.push(val);
                        await updateDataList(items, sha, "Add", val);
                        setStatus("성공적으로 구독되었습니다! 🎉", "var(--success-color)");
                        inputField.value = '';
                    }
                } else {
                    if (!items.includes(val)) {
                        setStatus(`등록되지 않은 ${currentMode === 'Email' ? '이메일' : 'ID'}입니다.`, "var(--danger-color)");
                    } else {
                        const newList = items.filter(i => i !== val);
                        await updateDataList(newList, sha, "Remove", val);
                        setStatus("구독이 해지되었습니다. 😢", "var(--text-color)");
                        inputField.value = '';
                    }
                }
            } catch (err) {
                console.error(err);
                setStatus("처리 중 오류가 발생했습니다: " + err.message, "var(--danger-color)");
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        subBtn.addEventListener('click', () => handleAction('Subscribe'));
        unsubBtn.addEventListener('click', () => handleAction('Unsubscribe'));

        // Initialize with Telegram mode
        setMode('Telegram');
    </script>
</body>
</html>
