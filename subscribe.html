<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe | AI Trend Analyzer</title>
    <style>
        :root {
            --primary-color: #471c87;
            --secondary-color: #3498db;
            --success-color: #2ea44f;
            --danger-color: #e74c3c;
            --bg-color: #f4f4f9;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text-color);
        }

        .subscribe-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
            color: #555;
        }

        input[type="email"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
            outline: none;
        }

        input[type="email"]:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-subscribe {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-subscribe:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-unsubscribe {
            background-color: transparent;
            color: var(--danger-color);
            border: 2px solid var(--danger-color);
        }

        .btn-unsubscribe:hover {
            background-color: var(--danger-color);
            color: white;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.2);
        }

        .btn-back {
            margin-top: 20px;
            background: none;
            color: #888;
            font-size: 0.9em;
            text-decoration: underline;
            border: none;
            padding: 5px;
            width: auto;
            display: inline-block;
        }

        .btn-back:hover {
            color: var(--text-color);
        }

        #status-msg {
            margin-top: 20px;
            font-size: 0.9em;
            font-weight: 500;
            min-height: 1.2em;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>
    <div class="subscribe-container">
        <p>AI 일일 동향 리포트를<br>이메일로 받아보세요. (무료)</p>
        <p style="font-size: 0.8rem; color: #888; margin-top: -20px; margin-bottom: 25px;">
            * 개인정보 보호를 위해 구독 정보는 1년마다 초기화됩니다.
        </p>
        
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="example@email.com" required>
        </div>

        <div class="button-group">
            <button id="subscribeBtn" class="btn-subscribe">
                <span class="loader" id="subLoader"></span>
                구독하기
            </button>
            <button id="unsubscribeBtn" class="btn-unsubscribe">
                <span class="loader" id="unsubLoader"></span>
                구독취소
            </button>
        </div>

        <div id="status-msg"></div>

        <button onclick="location.href='index.html'" class="btn-back">Back to Home</button>
        
        <div style="margin-top: 30px; font-size: 0.85em; color: #aaa;">
            &copy; Maj.Cjh. All rights reserved.
        </div>
    </div>

    <script>
        const OWNER = "jhjhc1483";
        const REPO = "AI_Trend_Analysis_vercel";
        const BRANCH = "main";
        const FILE_PATH = "codes/receiver_email.json";

        async function callProxyAPI(endpoint, method = 'GET', body = null) {
            const res = await fetch('/api/github', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ endpoint, method, body })
            });
            if (!res.ok && res.status !== 404) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.message || `HTTP Error ${res.status}`);
            }
            if (res.status === 204) return null;
            if (res.status === 404) return null;
            return await res.json();
        }

        function base64ToUtf8(base64) {
            const binary = atob(base64.replace(/\n/g, ""));
            const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
            return new TextDecoder("utf-8").decode(bytes);
        }

        function utf8ToBase64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        async function getEmailList() {
            const endpoint = `repos/${OWNER}/${REPO}/contents/${FILE_PATH}?ref=${BRANCH}`;
            const data = await callProxyAPI(endpoint, 'GET');
            const todayStr = getKSTDate();
            
            if (!data) return { emails: [], sha: null };
            
            const content = base64ToUtf8(data.content);
            let parsed = JSON.parse(content);
            let emailList = [];

            // 구조 파싱 (기존 객체 구조/리스트 구조 모두 대응)
            if (Array.isArray(parsed)) {
                emailList = parsed;
            } else if (parsed.emails) {
                emailList = parsed.emails;
            }

            // 마이그레이션 및 1년 만료 체크
            const today = new Date(todayStr);
            const validEmails = emailList.map(item => {
                // 문자열인 경우 객체로 변환 (마이그레이션)
                if (typeof item === 'string') {
                    return { email: item, date: todayStr };
                }
                return item;
            }).filter(item => {
                // 365일 경과 체크
                const regDate = new Date(item.date);
                const diffDays = (today - regDate) / (1000 * 60 * 60 * 24);
                return diffDays < 365;
            });

            return {
                emails: validEmails,
                sha: data.sha
            };
        }

        function getKSTDate() {
            // 한국 시간(KST) 문자열 반환 (YYYY-MM-DD)
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const kst = new Date(utc + (9 * 60 * 60000));
            return kst.toISOString().split('T')[0];
        }

        async function updateEmailList(emails, sha, action) {
            const endpoint = `repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
            const dataToSave = {
                emails: emails
            };
            const jsonString = JSON.stringify(dataToSave, null, 2);
            const body = {
                message: `${action} email: ${action === 'Add' ? emails[emails.length - 1].email : 'update'}`,
                content: utf8ToBase64(jsonString),
                branch: BRANCH
            };
            if (sha) body.sha = sha;

            await callProxyAPI(endpoint, 'PUT', body);
        }

        const emailInput = document.getElementById('email');
        const statusMsg = document.getElementById('status-msg');
        const subBtn = document.getElementById('subscribeBtn');
        const unsubBtn = document.getElementById('unsubscribeBtn');
        const subLoader = document.getElementById('subLoader');
        const unsubLoader = document.getElementById('unsubLoader');

        function setStatus(msg, color) {
            statusMsg.textContent = msg;
            statusMsg.style.color = color;
        }

        async function handleAction(action) {
            const email = emailInput.value.trim();
            if (!email || !email.includes('@')) {
                setStatus("유효한 이메일을 입력해주세요.", "var(--danger-color)");
                return;
            }

            const loader = action === 'Subscribe' ? subLoader : unsubLoader;
            const btn = action === 'Subscribe' ? subBtn : unsubBtn;
            
            try {
                btn.disabled = true;
                loader.style.display = 'inline-block';
                setStatus(`${action === 'Subscribe' ? '구독' : '해지'} 처리 중...`, "var(--secondary-color)");

                const { emails, sha } = await getEmailList();
                
                if (action === 'Subscribe') {
                    if (emails.some(e => e.email === email)) {
                        setStatus("이미 등록된 이메일입니다.", "var(--secondary-color)");
                    } else {
                        emails.push({ email: email, date: getKSTDate() });
                        await updateEmailList(emails, sha, "Add");
                        setStatus("성공적으로 구독되었습니다! 🎉", "var(--success-color)");
                        emailInput.value = '';
                    }
                } else {
                    if (!emails.some(e => e.email === email)) {
                        setStatus("등록되지 않은 이메일입니다.", "var(--danger-color)");
                    } else {
                        const newList = emails.filter(e => e.email !== email);
                        await updateEmailList(newList, sha, "Remove");
                        setStatus("구독이 해지되었습니다. 😢", "var(--text-color)");
                        emailInput.value = '';
                    }
                }
            } catch (err) {
                console.error(err);
                setStatus("처리 중 오류가 발생했습니다: " + err.message, "var(--danger-color)");
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        subBtn.addEventListener('click', () => handleAction('Subscribe'));
        unsubBtn.addEventListener('click', () => handleAction('Unsubscribe'));
    </script>
</body>
</html>
