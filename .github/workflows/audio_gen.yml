name: AI Audio Briefing Generator (Google Cloud TTS)

on:
  workflow_dispatch:
  # 즐겨찾기 생성(auto_favorites.yml)이 끝나면 자동 실행
  workflow_run:
    workflows: ["Auto Favorites Generation"]
    types: [completed]

concurrency:
  group: audio-pipeline
  cancel-in-progress: false

jobs:
  build:
    # 즐겨찾기 생성이 성공했을 때만 실행 (수동 실행은 항상 허용)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
      with:
        ref: main  # 즐겨찾기 결과가 반영된 최신 main

    - name: Python 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 필요 라이브러리 설치
      # edge-tts: Microsoft Edge 브라우저의 무료 Neural TTS
      run: |
        pip install google-genai edge-tts python-dotenv

    # 자동 실행일 때는 같은 일일 동향으로 이미 만든 오디오가 있으면 건너뜀. 대시보드 수동 실행은 항상 실행.
    - name: 오디오 생성 스크립트 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PIPELINE_AUTO: ${{ github.event_name == 'workflow_run' }}
      run: |
        python codes/pycode/gen_audio.py

    - name: 결과물(mp3, json) 커밋 및 푸시
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add public/audio.mp3
        git add codes/data.json
        if [ -f codes/state/audio.json ]; then git add codes/state/audio.json; fi
        git commit -m "Update audio and briefing (Edge-TTS)" || echo "No changes to commit"
        git pull --rebase --autostash origin main
        git push

    # 실패하면 관리자에게 즉시 알림 (어느 단계에서 멈췄는지 상태 포함)
    - name: 실패 알림
      if: failure()
      env:
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: python codes/pycode/pipeline_report.py --failed "오디오 생성" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
