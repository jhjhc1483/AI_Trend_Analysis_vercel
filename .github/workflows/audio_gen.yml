name: AI Audio Briefing Generator (Google Cloud TTS)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 매일 오전 3시
    - cron: '0 19 * * *' # 매일 오전 4시
    # - cron: '30 21 * * *' #매일 오전 6시반 
    # - cron: '0 21 * * *' # 매일 오전 6시

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v3

    - name: Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 필요 라이브러리 설치
      # edge-tts: Microsoft Edge 브라우저의 무료 Neural TTS
      run: |
        pip install google-generativeai edge-tts

    - name: 오디오 생성 스크립트 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python codes/pycode/gen_audio.py

    - name: 결과물(mp3, json) 커밋 및 푸시
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add public/audio.mp3
        git add codes/data.json
        git commit -m "Update audio and briefing (Edge-TTS)" || echo "No changes to commit"
        git push