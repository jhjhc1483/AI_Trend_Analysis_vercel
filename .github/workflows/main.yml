name: Run Python Scripts Daily

on:
  # 매일 시작 순서
  #   1순위: Claude 예약 작업 — 04:03 KST 시작(round 1), 05:13 KST 점검·복구(실패 단계만 다시 실행)
  #   2순위: 아래 GitHub 예약(schedule) — Claude 쪽이 끝난 뒤의 예비. 이미 수집했으면 거의 할 일 없이 끝남
  workflow_dispatch: # Claude 예약 작업 / 대시보드 '기사 다시 수집' / 수동 실행
    inputs:
      round:
        description: '실행 회차 (ScraperAPI 키 순번이 다름: 1 = 시작, 2 = 재시도)'
        required: false
        default: '1'
        type: choice
        options: ['1', '2']
  # 2순위(예비): GitHub 예약은 몇 시간씩 늦게 도는 일이 잦아(예: 00:06 예약 → 08~11시 실행) 시작 신호로 쓰지 않음.
  # Claude 예약 작업(04:03 시작, 05:13 점검)보다 먼저 돌면 순서가 뒤집히므로 반드시 그 뒤 시각으로 둠.
  #   (tests/test_workflows.py 가 확인. 자정~05:13 KST 사이로 옮기지 말 것)
  # 예약 실행은 항상 '오늘 실패한 출처만 재시도' 모드:
  #   오늘 수집 기록이 없으면 전체 수집, 있으면 실패한 출처만, 모두 성공했으면 건너뜀.
  #   끝나면 AI 선정 → 오디오 → 메일이 이어지되, 오늘 이미 끝난 단계는 각자 건너뜀 (안 된 단계만 진행)
  schedule:
    - cron: '47 20 * * *' # 매일 05:47 KST — 예비 1 (round 1 키)
    - cron: '17 22 * * *' # 매일 07:17 KST — 예비 2 (round 2 키)

# 1회차/2회차가 겹쳐서 동시에 push 하지 않도록 순차 실행
concurrency:
  group: crawl-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 버전은 requirements.txt 에 고정 (numpy 는 pandas 가 설치)
          pip install -c requirements.txt selenium requests beautifulsoup4 pandas webdriver-manager python-dotenv

      - name: Set up Chrome for Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Select Scraper API Key (3-Key Rotation)
        env:
          KEY_1: ${{ secrets.SCRAPER_API_KEY }}
          KEY_2: ${{ secrets.SCRAPER_API_KEY_2 }}
          KEY_3: ${{ secrets.SCRAPER_API_KEY_3 }}
        run: |
          export TZ="Asia/Seoul"
          DAY=$(date +%-d)        # 오늘 일자 (1~31)
          MOD=$(( DAY % 3 ))      # 3으로 나눈 나머지 (0, 1, 2)
          CRON="${{ github.event.schedule }}"

          # 회차 결정: 수동/외부 트리거면 inputs.round, schedule이면 cron 문자열로 판단
          ROUND="${{ inputs.round }}"
          if [ -z "$ROUND" ]; then
            if [ "$CRON" = "17 22 * * *" ]; then ROUND=2; else ROUND=1; fi  # 예비 2 = round 2
          fi

          if [ "$ROUND" = "2" ]; then
            # [2회차] 재시도 (점검·복구, 예비 2)
            if [ $MOD -eq 1 ]; then
              CHOSEN_KEY="$KEY_2"
              KEY_NAME="2번 키"
            elif [ $MOD -eq 2 ]; then
              CHOSEN_KEY="$KEY_1"
              KEY_NAME="1번 키"
            else
              CHOSEN_KEY="$KEY_3"
              KEY_NAME="3번 키"
            fi
          else
            # [1회차] 시작 (Claude 예약 작업, 예비 1, 수동 실행)
            if [ $MOD -eq 1 ]; then
              CHOSEN_KEY="$KEY_1"
              KEY_NAME="1번 키"
            elif [ $MOD -eq 2 ]; then
              CHOSEN_KEY="$KEY_3"
              KEY_NAME="3번 키"
            else
              CHOSEN_KEY="$KEY_2"
              KEY_NAME="2번 키"
            fi
          fi

          # 3번 키 미설정 시 1번 키로 fallback 방어
          if [ -z "$CHOSEN_KEY" ]; then
            echo "경고: 선택된 키가 비어있어 기본 1번 키를 사용합니다."
            CHOSEN_KEY="$KEY_1"
            KEY_NAME="1번 키(기본)"
          fi

          echo "=========================================="
          echo " 실행 일시: $(date +'%Y-%m-%d %H:%M:%S KST')"
          echo " 실행 모드: ${CRON:-수동/외부 실행(workflow_dispatch)} / ${ROUND}회차"
          echo " 오늘 날짜 mod 3: $MOD"
          echo " 적용된 Scraper API 키: $KEY_NAME"
          echo "=========================================="

          # 다음 단계에서 SCRAPER_API_KEY 및 키 명칭으로 사용할 수 있도록 GitHub 환경변수에 저장
          echo "SCRAPER_API_KEY=$CHOSEN_KEY" >> $GITHUB_ENV
          echo "SCRAPER_KEY_NAME=$KEY_NAME" >> $GITHUB_ENV
          echo "CRAWL_ROUND=$ROUND" >> $GITHUB_ENV

      # 2회차는 오늘 1회차에서 실패한 소스만 다시 수집 (모두 성공했으면 건너뜀)
      - name: Run All Python Scripts (Smart Isolated Runner & Alert)
        id: crawl
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SCRAPER_KEY_NAME: ${{ env.SCRAPER_KEY_NAME }}
          SCRAPER_API_KEY: ${{ env.SCRAPER_API_KEY }}
          KEY_1: ${{ secrets.SCRAPER_API_KEY }}
          KEY_2: ${{ secrets.SCRAPER_API_KEY_2 }}
          KEY_3: ${{ secrets.SCRAPER_API_KEY_3 }}
        run: |
          # --alert-only: 실패/의심 소스가 있을 때만 바로 알림 (평소 결과는 메일 발송 후 일일 요약에 포함)
          # 2회차이거나 GitHub 예약(예비용) 실행이면 오늘 실패한 출처만 재시도 (오늘 기록이 없으면 전체 수집)
          if [ "$CRAWL_ROUND" = "2" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            python codes/pycode/run_crawlers.py --retry-failed --alert-only
          else
            python codes/pycode/run_crawlers.py --alert-only
          fi

      # 현재 시간(KST)을 저장
      - name: Generate Last Updated Time
        if: steps.crawl.outputs.ran != 'false'
        run: |
          # public 폴더가 없으면 생성
          mkdir -p public
          
          # 한국 시간(KST) 설정
          export TZ="Asia/Seoul"
          NOW=$(date +'%Y-%m-%d %H:%M:%S')
          
          # meta.json 파일 생성 (이전 대화의 script.js와 호환됨)
          echo "{ \"completed_at\": \"$NOW\" }" > public/update_time.json
          
          echo "Timestamp generated: $NOW"

      - name: Commit and Push all changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: 'codes/*.json codes/state/*.json public/update_time.json'
          commit_message: 'Automated data update: All sources [skip ci]'
          branch: main

      # 실패하면 관리자에게 즉시 알림 (어느 단계에서 멈췄는지 상태 포함)
      - name: 실패 알림
        if: failure()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python codes/pycode/pipeline_report.py --failed "크롤링" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

