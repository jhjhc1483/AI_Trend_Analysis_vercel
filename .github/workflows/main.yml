name: Run Python Scripts Daily

on:
  workflow_dispatch: # 수동 실행 / cron-job.org 외부 트리거
    inputs:
      round:
        description: '실행 회차 (1 = 오전 1시분 키, 2 = 오전 1시반분 키)'
        required: false
        default: '1'
        type: choice
        options: ['1', '2']
  # ⚠️ cron-job.org 설정을 마치면 아래 schedule 블록은 삭제하세요 (중복 실행 방지)
  schedule:
    # GitHub 예약 실행은 실제로 4~8시간 늦게 시작되는 경우가 많음 (2회차는 1회차 실패분만 재시도)
    - cron: '6 15 * * *' # 매일 0시 6분 (한국시간) — 1회차 (자정 이전 불가: 생성기가 KST 어제 날짜 기사를 고름)
    - cron: '37 15 * * *' # 매일 0시 37분 (한국시간) — 2회차

# 1회차/2회차가 겹쳐서 동시에 push 하지 않도록 순차 실행
concurrency:
  group: crawl-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests beautifulsoup4 pandas webdriver-manager numpy python-dotenv

      - name: Set up Chrome for Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Select Scraper API Key (3-Key Rotation)
        env:
          KEY_1: ${{ secrets.SCRAPER_API_KEY }}
          KEY_2: ${{ secrets.SCRAPER_API_KEY_2 }}
          KEY_3: ${{ secrets.SCRAPER_API_KEY_3 }}
        run: |
          export TZ="Asia/Seoul"
          DAY=$(date +%-d)        # 오늘 일자 (1~31)
          MOD=$(( DAY % 3 ))      # 3으로 나눈 나머지 (0, 1, 2)
          CRON="${{ github.event.schedule }}"

          # 회차 결정: 수동/외부 트리거면 inputs.round, schedule이면 cron 문자열로 판단
          ROUND="${{ inputs.round }}"
          if [ -z "$ROUND" ]; then
            if [ "$CRON" = "37 15 * * *" ]; then ROUND=2; else ROUND=1; fi
          fi

          if [ "$ROUND" = "2" ]; then
            # [2회차] 오전 1:30 실행
            if [ $MOD -eq 1 ]; then
              CHOSEN_KEY="$KEY_2"
              KEY_NAME="2번 키"
            elif [ $MOD -eq 2 ]; then
              CHOSEN_KEY="$KEY_1"
              KEY_NAME="1번 키"
            else
              CHOSEN_KEY="$KEY_3"
              KEY_NAME="3번 키"
            fi
          else
            # [1회차] 오전 1:00 실행 (또는 수동 실행)
            if [ $MOD -eq 1 ]; then
              CHOSEN_KEY="$KEY_1"
              KEY_NAME="1번 키"
            elif [ $MOD -eq 2 ]; then
              CHOSEN_KEY="$KEY_3"
              KEY_NAME="3번 키"
            else
              CHOSEN_KEY="$KEY_2"
              KEY_NAME="2번 키"
            fi
          fi

          # 3번 키 미설정 시 1번 키로 fallback 방어
          if [ -z "$CHOSEN_KEY" ]; then
            echo "경고: 선택된 키가 비어있어 기본 1번 키를 사용합니다."
            CHOSEN_KEY="$KEY_1"
            KEY_NAME="1번 키(기본)"
          fi

          echo "=========================================="
          echo " 실행 일시: $(date +'%Y-%m-%d %H:%M:%S KST')"
          echo " 실행 모드: ${CRON:-수동/외부 실행(workflow_dispatch)} / ${ROUND}회차"
          echo " 오늘 날짜 mod 3: $MOD"
          echo " 적용된 Scraper API 키: $KEY_NAME"
          echo "=========================================="

          # 다음 단계에서 SCRAPER_API_KEY 및 키 명칭으로 사용할 수 있도록 GitHub 환경변수에 저장
          echo "SCRAPER_API_KEY=$CHOSEN_KEY" >> $GITHUB_ENV
          echo "SCRAPER_KEY_NAME=$KEY_NAME" >> $GITHUB_ENV
          echo "CRAWL_ROUND=$ROUND" >> $GITHUB_ENV

      # 2회차는 오늘 1회차에서 실패한 소스만 다시 수집 (모두 성공했으면 건너뜀)
      - name: Run All Python Scripts (Smart Isolated Runner & Alert)
        id: crawl
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SCRAPER_KEY_NAME: ${{ env.SCRAPER_KEY_NAME }}
          SCRAPER_API_KEY: ${{ env.SCRAPER_API_KEY }}
          KEY_1: ${{ secrets.SCRAPER_API_KEY }}
          KEY_2: ${{ secrets.SCRAPER_API_KEY_2 }}
          KEY_3: ${{ secrets.SCRAPER_API_KEY_3 }}
        run: |
          # --alert-only: 실패/의심 소스가 있을 때만 바로 알림 (평소 결과는 메일 발송 후 일일 요약에 포함)
          if [ "$CRAWL_ROUND" = "2" ]; then
            python codes/pycode/run_crawlers.py --retry-failed --alert-only
          else
            python codes/pycode/run_crawlers.py --alert-only
          fi

      # 대시보드 첫 화면용 최근 30일 데이터 (codes/dashboard/recent.json)
      - name: Build dashboard recent data
        if: steps.crawl.outputs.ran != 'false'
        run: python codes/pycode/build_dashboard_data.py

      # 현재 시간(KST)을 저장
      - name: Generate Last Updated Time
        if: steps.crawl.outputs.ran != 'false'
        run: |
          # public 폴더가 없으면 생성
          mkdir -p public
          
          # 한국 시간(KST) 설정
          export TZ="Asia/Seoul"
          NOW=$(date +'%Y-%m-%d %H:%M:%S')
          
          # meta.json 파일 생성 (이전 대화의 script.js와 호환됨)
          echo "{ \"completed_at\": \"$NOW\" }" > public/update_time.json
          
          echo "Timestamp generated: $NOW"

      - name: Commit and Push all changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'codes/*.json codes/state/*.json codes/dashboard/*.json public/update_time.json'
          commit_message: 'Automated data update: All sources [skip ci]'
          branch: main

      # 실패하면 관리자에게 즉시 알림 (어느 단계에서 멈췄는지 상태 포함)
      - name: 실패 알림
        if: failure()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python codes/pycode/pipeline_report.py --failed "크롤링" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

