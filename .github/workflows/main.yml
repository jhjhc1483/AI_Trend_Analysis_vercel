name: Run Python Scripts Daily

on:
  workflow_dispatch: # 수동 실행
  schedule:
    - cron: '0 16 * * *' # 매일 오전 1시 (한국시간)
    - cron: '30 16 * * *' # 매일 오전 1시반 (한국시간)
    # - cron: '0 20 * * *' # 매일 오전 5시
    # - cron: '30 20 * * 0-4' #매주 월~금 오전 5시반  
    # - cron: '0 21 * * *'  # 매일 오전 6시
    # - cron: '30 21 * * 0-4'  # 매주 월~금 오전 6시반
    # - cron: '0 9 * * *'
    # # 매일 한국 시간 오전 10시반
    # - cron: '30 1 * * *'    
    # # 매일 한국 시간 오전 7시 (UTC 22시)
    # - cron: '0 22 * * *'  
    # # 매일 한국 시간 오전 6시반
    # - cron: '30 21 * * *'  
    # # 매일 한국 시간 오전 6시 (UTC 21시)
    # - cron: '0 21 * * *'
    # # 매일 한국 시간 오전 5시반
    # - cron: '30 21 * * *'    
    # # 매일 한국 시간 오후 12시 (UTC 3시)
    # - cron: '0 3 * * *'
    # # 매일 한국 시간 오후 6시 (UTC 9시)
    # - cron: '0 9 * * *'
    # # 매주 월요일 오전 9시 (UTC 0시)
    # #- cron: '0 0 * * 1'

jobs: 
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests beautifulsoup4 pandas webdriver-manager numpy python-dotenv

      - name: Set up Chrome for Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Select Scraper API Key (3-Key Rotation)
        env:
          KEY_1: ${{ secrets.SCRAPER_API_KEY }}
          KEY_2: ${{ secrets.SCRAPER_API_KEY_2 }}
          KEY_3: ${{ secrets.SCRAPER_API_KEY_3 }}
        run: |
          export TZ="Asia/Seoul"
          DAY=$(date +%-d)        # 오늘 일자 (1~31)
          MOD=$(( DAY % 3 ))      # 3으로 나눈 나머지 (0, 1, 2)
          CRON="${{ github.event.schedule }}"

          if [ "$CRON" = "30 16 * * *" ]; then
            # [2회차] 오전 1:30 실행
            if [ $MOD -eq 1 ]; then
              CHOSEN_KEY="$KEY_2"
              KEY_NAME="2번 키"
            elif [ $MOD -eq 2 ]; then
              CHOSEN_KEY="$KEY_1"
              KEY_NAME="1번 키"
            else
              CHOSEN_KEY="$KEY_3"
              KEY_NAME="3번 키"
            fi
          else
            # [1회차] 오전 1:00 실행 (또는 수동 실행)
            if [ $MOD -eq 1 ]; then
              CHOSEN_KEY="$KEY_1"
              KEY_NAME="1번 키"
            elif [ $MOD -eq 2 ]; then
              CHOSEN_KEY="$KEY_3"
              KEY_NAME="3번 키"
            else
              CHOSEN_KEY="$KEY_2"
              KEY_NAME="2번 키"
            fi
          fi

          # 3번 키 미설정 시 1번 키로 fallback 방어
          if [ -z "$CHOSEN_KEY" ]; then
            echo "경고: 선택된 키가 비어있어 기본 1번 키를 사용합니다."
            CHOSEN_KEY="$KEY_1"
            KEY_NAME="1번 키(기본)"
          fi

          echo "=========================================="
          echo " 실행 일시: $(date +'%Y-%m-%d %H:%M:%S KST')"
          echo " 실행 모드: ${CRON:-수동 실행(workflow_dispatch)}"
          echo " 오늘 날짜 mod 3: $MOD"
          echo " 적용된 Scraper API 키: $KEY_NAME"
          echo "=========================================="

          # 다음 단계에서 SCRAPER_API_KEY 및 키 명칭으로 사용할 수 있도록 GitHub 환경변수에 저장
          echo "SCRAPER_API_KEY=$CHOSEN_KEY" >> $GITHUB_ENV
          echo "SCRAPER_KEY_NAME=$KEY_NAME" >> $GITHUB_ENV

      - name: Run All Python Scripts (Smart Isolated Runner & Alert)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SCRAPER_KEY_NAME: ${{ env.SCRAPER_KEY_NAME }}
        run: |
          python codes/pycode/run_crawlers.py

      # 현재 시간(KST)을 저장
      - name: Generate Last Updated Time
        run: |
          # public 폴더가 없으면 생성
          mkdir -p public
          
          # 한국 시간(KST) 설정
          export TZ="Asia/Seoul"
          NOW=$(date +'%Y-%m-%d %H:%M:%S')
          
          # meta.json 파일 생성 (이전 대화의 script.js와 호환됨)
          echo "{ \"completed_at\": \"$NOW\" }" > public/update_time.json
          
          echo "Timestamp generated: $NOW"

      - name: Commit and Push all changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'codes/*.json public/update_time.json'
          commit_message: 'Automated data update: All sources [skip ci]'
          branch: main

