name: Auto Favorites Generation

on:
  workflow_dispatch:
  # 크롤링(main.yml)이 끝나면 자동 실행 — 시간 예약 대신 체인 연결
  workflow_run:
    workflows: ["Run Python Scripts Daily"]
    types: [completed]

concurrency:
  group: favorites-pipeline
  cancel-in-progress: false

jobs:
  build:
    # 크롤링이 성공했을 때만 실행 (수동 실행은 항상 허용)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
      with:
        ref: main  # 크롤링 결과가 반영된 최신 main

    - name: Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 필요 라이브러리 설치
      run: |
        pip install google-genai
        pip install python-dotenv

    - name: 즐겨찾기 자동 생성 스크립트 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python codes/pycode/auto_favorites.py

    - name: 텍스트 변환 스크립트 실행 (JSON to TXT)
      env:
        AUTO_MODE: 'true'
      run: |
        python codes/pycode/json_to_txt.py

    - name: 결과물 커밋 및 푸시
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add codes/favorites/*.json codes/data.txt codes/data.json
        git commit -m "Update favorites & data.txt/json (Auto-generated)" || echo "No changes to commit"
        git pull --rebase --autostash origin main
        git push

