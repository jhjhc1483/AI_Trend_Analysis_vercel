# .github/workflows/json_to_txt.yml

name: Run Python Scripts Daily_jsontotxt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 작업 환경 설정
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 대시보드 '즐겨찾기 업로드' 버튼으로 실행됨 (표준 라이브러리만 사용)
      - name: Run json_to_txt.py
        run: python codes/pycode/json_to_txt.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'codes/data.*'
          commit_message: 'Automated data.txt & data.json update [skip ci]'
          branch: main 
