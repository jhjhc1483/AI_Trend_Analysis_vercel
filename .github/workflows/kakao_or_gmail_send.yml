name: KakaoTalk or Gmail Auto Send

on:
  workflow_dispatch: # GitHub 웹에서 버튼 눌러서 직접 실행 가능
    inputs:
      mode:
        description: 'send = 메일 발송, cleanup_only = 메일 없이 구독자 목록 정리/암호화만'
        required: false
        default: 'send'
        type: choice
        options: ['send', 'cleanup_only']
  schedule:
   - cron: '53 20 * * *' # 매일 오전 5시 53분 (지연 감안해 6시 직전으로)    

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv cryptography

      # 구독자 목록 정리 + (키가 있으면) 암호화 형식으로 변환
      - name: Cleanup expired emails
        env:
          SUBSCRIBER_ENCRYPTION_KEY: ${{ secrets.SUBSCRIBER_ENCRYPTION_KEY }}
        run: python codes/pycode/cleanup_expired_emails.py

      - name: Run KakaoTalk or Gamil Script
        if: ${{ inputs.mode != 'cleanup_only' }}  # 예약 실행 시에는 inputs가 비어 있으므로 항상 발송
        env:
          # GitHub Secrets에 저장된 키를 환경 변수로 매핑
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GMAIL_APP_PASSWORD : ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBER_ENCRYPTION_KEY: ${{ secrets.SUBSCRIBER_ENCRYPTION_KEY }}

        run : python codes/pycode/gmail_send_visualizer.py
        # run : python codes/pycode/gmail_send.py
        # run: python codes/pycode/send_kakao2.py

      # 메일 단계가 실패해도 정리/암호화된 구독자 목록은 저장
      - name: Commit cleaned receiver list
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add codes/receiver_email.json
          git diff --cached --quiet || git commit -m "🧹 구독자 목록 자동 정리"
          git pull --rebase --autostash origin main
          git push
