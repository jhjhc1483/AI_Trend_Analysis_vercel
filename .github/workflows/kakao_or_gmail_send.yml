name: KakaoTalk or Gmail Auto Send

on:
  workflow_dispatch: # GitHub 웹에서 버튼 눌러서 직접 실행 가능
    inputs:
      mode:
        description: 'send = 오늘 아직 안 보냈으면 발송, resend = 이미 보냈어도 다시 발송, cleanup_only = 메일 없이 구독자 목록 정리/암호화만'
        required: false
        default: 'send'
        type: choice
        options: ['send', 'resend', 'cleanup_only']
  # 오디오 생성이 끝나면 바로 발송 (오디오가 실패해도 일일 동향이 준비됐으면 발송)
  workflow_run:
    workflows: ["AI Audio Briefing Generator (Google Cloud TTS)"]
    types: [completed]
  # (예약 실행 없음: 체인이 끊긴 날은 Actions에서 mode=send로 수동 실행)

# 체인 실행과 수동 실행이 겹쳐도 순서대로 실행되도록 (뒤에 실행되는 쪽은 발송 기록을 보고 건너뜀)
concurrency:
  group: mail-send
  cancel-in-progress: false

jobs:
  build:
    # 오디오 단계가 취소/건너뜀으로 끝난 경우는 제외
    if: github.event_name != 'workflow_run' || contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main  # 앞 단계 결과와 최신 발송 기록이 반영된 main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -c requirements.txt requests python-dotenv cryptography

      # 구독자 목록 정리 + (키가 있으면) 암호화 형식으로 변환
      - name: Cleanup expired emails
        env:
          SUBSCRIBER_ENCRYPTION_KEY: ${{ secrets.SUBSCRIBER_ENCRYPTION_KEY }}
        run: python codes/pycode/cleanup_expired_emails.py

      - name: Send briefing mail
        id: mail
        if: ${{ inputs.mode != 'cleanup_only' }}  # 체인 실행 시에는 inputs가 비어 있으므로 항상 발송
        env:
          # GitHub Secrets에 저장된 키를 환경 변수로 매핑 (카카오톡 발송은 쓰지 않음)
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBER_ENCRYPTION_KEY: ${{ secrets.SUBSCRIBER_ENCRYPTION_KEY }}
          MAIL_MODE: ${{ inputs.mode == 'resend' && 'resend' || 'send' }}

        run: python codes/pycode/gmail_send_visualizer.py

      # 오늘 처음 발송했을 때만 관리자에게 일일 요약 (크롤링·AI 선정·오디오·메일 결과 한 통으로)
      - name: 관리자 일일 요약 메일
        if: success() && steps.mail.outputs.sent == 'true'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python codes/pycode/pipeline_report.py --summary

      # 메일 단계가 실패해도 정리/암호화된 구독자 목록과 발송 기록은 저장
      - name: Commit cleaned receiver list
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add codes/receiver_email.json
          if [ -f codes/state/mail.json ]; then git add codes/state/mail.json; fi
          git diff --cached --quiet || git commit -m "📧 메일 발송 기록 및 구독자 목록 업데이트"
          git pull --rebase --autostash origin main
          git push
