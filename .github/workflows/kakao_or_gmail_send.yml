name: KakaoTalk or Gmail Auto Send

on:
  workflow_dispatch: # GitHub 웹에서 버튼 눌러서 직접 실행 가능
  schedule:
   - cron: '0 21 * * *' #매일 오전 6시    

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv

      - name: Cleanup expired emails
        run: python codes/pycode/cleanup_expired_emails.py

      - name: Run KakaoTalk or Gamil Script
        env:
          # GitHub Secrets에 저장된 키를 환경 변수로 매핑
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GMAIL_APP_PASSWORD : ${{ secrets.GMAIL_APP_PASSWORD }}

        run : python codes/pycode/gmail_send_visualizer.py
        # run : python codes/pycode/gmail_send.py
        # run: python codes/pycode/send_kakao2.py

      - name: Commit cleaned receiver list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add codes/receiver_email.json
          git diff --cached --quiet || git commit -m "🧹 만료된 구독자 자동 정리"
          git push
