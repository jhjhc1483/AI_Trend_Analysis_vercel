<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📰오늘의 AI 동향 브리핑이 도착했어요</title>
    
    <!-- 카카오톡 / SNS 링크 공유 미리보기(Open Graph) 설정 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="📰 오늘의 AI 동향 브리핑이 도착했어요">
    <meta property="og:description" content="매일 아침 업데이트되는 최신 AI 트렌드 3줄 요약과 음성 브리핑을 지금 바로 확인해 보세요!">
    <meta property="og:url" content="https://ai-trend-analysis.vercel.app/visualizer_brief.html">
    <meta property="og:image" content="https://ai-trend-analysis.vercel.app/public/thumbnail.png">

    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8faf9;
            --brand-color: #2c5234;
            --accent-color: #4ade80;
            --text-main: #222222;
            --text-sub: #555555;
            --card-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8faf9 0%, #e8f0eb 100%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 장식용 원형 백그라운드 */
        .container::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: var(--accent-color);
            opacity: 0.1;
            border-radius: 50%;
            z-index: 0;
        }

        .header {
            position: relative;
            z-index: 1;
            margin-bottom: 30px;
        }

        .icon-bot {
            font-size: 48px;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            color: var(--brand-color);
            margin: 0 0 5px 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .date-badge {
            display: inline-block;
            background-color: #e8f0eb;
            color: var(--brand-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }

        .briefing-box {
            position: relative;
            z-index: 1;
            background-color: #ffffff;
            border: 2px solid #eef2f0;
            border-radius: 16px;
            padding: 25px 20px;
            text-align: left;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .briefing-list {
            margin: 0;
            padding-left: 20px;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-main);
            font-weight: 500;
        }

        .briefing-list li {
            margin-bottom: 12px;
            padding-left: 5px;
        }

        .briefing-list li:last-child {
            margin-bottom: 0;
        }

        /* 액션 버튼 영역 */
        .actions {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-audio {
            background-color: var(--brand-color);
            color: white;
            box-shadow: 0 4px 15px rgba(44, 82, 52, 0.2);
        }

        .btn-audio:hover {
            background-color: #1e3b25;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(44, 82, 52, 0.3);
        }

        .btn-detail {
            background-color: #f1f5f3;
            color: var(--brand-color);
            border: 1px solid #e0e8e4;
        }

        .btn-detail:hover {
            background-color: #e8f0eb;
            transform: translateY(-2px);
        }

        .icon {
            font-size: 20px;
        }

        /* 오디오 플레이어 (숨김 상태) */
        .audio-player-container {
            display: none;
            margin-top: -5px;
            margin-bottom: 20px;
            width: 100%;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 40px 0;
            color: var(--text-sub);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon-bot">🤖</div>
            <h1>오늘의 AI 동향 브리핑 <br><span id="dateBadge" style="font-size: 18px; color: var(--text-sub); font-weight: 500;"></span></h1>
        </div>
        
        <div class="briefing-box">
            <div id="loading" class="loading">
                최신 기사를 요약하고 있습니다...<br>잠시만 기다려주세요.
            </div>
            <ul id="briefingList" class="briefing-list" style="display: none;">
                <!-- JS로 리스트 아이템 삽입 -->
            </ul>
        </div>
        
        <div id="audioContainer" class="audio-player-container">
            <audio id="audioPlayer" controls controlsList="nodownload">
                <source src="public/audio.mp3" type="audio/mpeg">
                브라우저가 오디오를 지원하지 않습니다.
            </audio>
        </div>

        <div class="actions">
            <button id="playBtn" class="btn btn-audio">
                <span class="icon">🎧</span> 브리핑 음성으로 바로 듣기
            </button>
            <a href="visualizer.html" class="btn btn-detail">
                <span class="icon">🧾</span> 전체 상세 기사 보기
            </a>
        </div>
    </div>

    <script>
        async function fetchBriefing() {
            try {
                const response = await fetch(`codes/data.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('네트워크 오류');
                
                const historyData = await response.json();
                
                // 가장 최신 날짜 찾기 (briefing 키가 있는 가장 최근 날짜)
                const dates = Object.keys(historyData).sort((a, b) => b.localeCompare(a));
                let latestDate = "";
                let briefingText = "";
                
                for (let date of dates) {
                    if (historyData[date] && historyData[date].briefing) {
                        latestDate = date;
                        briefingText = historyData[date].briefing;
                        break;
                    }
                }
                
                if (!briefingText) throw new Error('브리핑 데이터를 찾을 수 없습니다.');
                
                // 날짜 포맷 (예: 26.06.01 -> 2026.06.01)
                const formattedDate = "20" + latestDate;
                document.getElementById('dateBadge').textContent = `(${formattedDate})`;
                
                // 텍스트를 리스트(ul > li) 형태로 변환
                const ul = document.getElementById('briefingList');
                const loading = document.getElementById('loading');
                
                // 텍스트를 줄바꿈 기준으로 분리
                const lines = briefingText.split('\n');
                ul.innerHTML = ''; // 초기화
                
                lines.forEach(line => {
                    const cleanLine = line.trim();
                    // 대시(-)나 점(.)으로 시작하는 라인 또는 내용이 있는 라인만 추출
                    if (cleanLine.length > 0) {
                        const li = document.createElement('li');
                        // 앞의 기호(-, *, 숫자 등) 제거하고 순수 텍스트만
                        li.textContent = cleanLine.replace(/^[-*•\d\.]+\s*/, '');
                        if(li.textContent.length > 0) {
                            ul.appendChild(li);
                        }
                    }
                });
                
                // 화면 전환
                loading.style.display = 'none';
                ul.style.display = 'block';
                
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                document.getElementById('loading').textContent = "오늘의 브리핑 데이터를 불러오지 못했습니다.";
            }
        }

        // 오디오 재생 버튼 이벤트
        document.getElementById('playBtn').addEventListener('click', function() {
            const audioContainer = document.getElementById('audioContainer');
            const audioPlayer = document.getElementById('audioPlayer');
            
            // 플레이어 보이기
            audioContainer.style.display = 'block';
            // 버튼 숨기기
            this.style.display = 'none';
            // 자동 재생 시도
            audioPlayer.play().catch(e => {
                console.log("자동 재생이 차단되었습니다. 수동으로 재생 버튼을 눌러주세요.");
            });
        });

        // 페이지 로드 시 실행
        document.addEventListener('DOMContentLoaded', fetchBriefing);
    </script>
</body>
</html>
