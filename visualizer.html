<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📰오늘의 AI 동향 브리핑이 도착했어요</title>
    <!-- Modern Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8faf9;
            --brand-color: #2c5234;
            /* Dark Teal/Green */
            --accent-color: #4ade80;
            /* Light Green */
            --text-main: #333333;
            --text-sub: #666666;
            --card-bg: #ffffff;
            --section-bg: #f1f5f3;
            --item-bg: #eff4f1;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Noto Sans KR', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 640px;
            padding: 0;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .logo-icon {
            font-size: 1.5rem;
        }

        h1.brand {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--brand-color);
            margin: 0;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 30px;
        }

        .date-box {
            display: inline-block;
            background-color: transparent;
            border: 2px solid #e2e8f0;
            padding: 10px 25px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--brand-color);
            margin-bottom: 0;
            grid-column: 2; /* Ensure it stays in the middle column */
        }

        .btn-input {
            background-color: #f3f4f6;
            border: 1px solid #e5e7eb;
            padding: 8px 20px;
            border-radius: 8px;
            color: #6b7280;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-input:hover {
            background-color: #e5e7eb;
        }

        #date-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .header-actions {
            grid-column: 3;
            justify-self: start;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 15px;
        }

        .btn-history {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f5f9;
            color: var(--brand-color);
            border: 1px solid #e2e8f0;
            box-shadow: none;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }

        /* Audio Player Bar */
        .audio-player-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--brand-color), #3b6d45);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(44, 82, 52, 0.2);
        }

        .audio-player-bar .audio-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .audio-player-bar .audio-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-shrink: 0;
        }

        .audio-player-bar .audio-label {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.85);
            font-weight: 500;
            white-space: nowrap;
            line-height: 1.2;
        }

        .audio-player-bar .audio-sub {
            font-size: 0.55rem;
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
            line-height: 1.2;
            margin-top: 2px;
        }

        .audio-player-bar audio {
            flex: 1;
            min-width: 0;
            height: 32px;
            border-radius: 8px;
        }

        /* Style the audio element for webkit browsers */
        .audio-player-bar audio::-webkit-media-controls-panel {
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
        }

        /* Section Styles */
        .section-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px 12px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e8ede9;
        }

        .section-bar {
            width: 4px;
            height: 28px;
            background-color: var(--brand-color);
            border-radius: 2px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--brand-color);
        }

        /* Article Items */
        .article-item {
            background-color: transparent;
            border-radius: 8px;
            padding: 10px 8px;
            margin-bottom: 2px;
            transition: var(--transition);
            cursor: pointer;
            display: block;
            text-decoration: none;
            color: inherit;
            border-left: 3px solid transparent;
        }

        .article-item:last-child {
            margin-bottom: 0;
        }

        .article-item:hover {
            transform: none;
            background-color: #eef4f0;
            border-left-color: var(--brand-color);
        }

        .article-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .article-title {
            font-size: 0.93rem;
            font-weight: 500;
            line-height: 1.55;
            color: #1a1a1a;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .article-tag {
            background-color: #f0f5f1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--brand-color);
            border: none;
        }

        .article-link {
            font-size: 0.78rem;
            font-weight: 500;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .article-link::after {
            content: '→';
            font-size: 0.9rem;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            text-align: center;
            color: #9ca3af;
            font-size: 0.85rem;
        }

        /* Loading Spinner */
        #loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(44, 82, 52, 0.1);
            border-left-color: var(--brand-color);
            border-radius: 50%;
            animation: rotate 1s linear infinite;
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        /* Briefing Toggle */
        .briefing-toggle {
            margin-bottom: 16px;
        }

        .briefing-toggle summary {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid #e2e8e4;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--brand-color);
            cursor: pointer;
            list-style: none;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .briefing-toggle summary::-webkit-details-marker {
            display: none;
        }

        .briefing-toggle summary::after {
            content: '\25BC';
            font-size: 0.7rem;
            margin-left: auto;
            transition: transform 0.3s ease;
            color: #9ca3af;
        }

        .briefing-toggle[open] summary::after {
            transform: rotate(180deg);
        }

        .briefing-toggle summary:hover {
            background: #f1f5f3;
        }

        .briefing-toggle .briefing-content {
            background: var(--card-bg);
            border: 1px solid #e8ede9;
            border-top: none;
            border-radius: 0 0 12px 12px;
            padding: 16px 18px;
            margin-top: -8px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .briefing-content ul {
            margin: 0;
            padding-left: 18px;
            list-style: none;
        }

        .briefing-content ul li {
            position: relative;
            padding-left: 6px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text-main);
            font-weight: 400;
            word-break: keep-all;
        }

        .briefing-content ul li:last-child {
            margin-bottom: 0;
        }

        .briefing-content ul li::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 9px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--brand-color);
            opacity: 0.5;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 4px;
            }

            .container {
                padding: 0;
            }

            h1.brand {
                font-size: 1.8rem;
            }

            .date-box {
                font-size: 0.95rem;
                padding: 8px 14px;
            }

            .section-card {
                border-radius: 10px;
                padding: 12px 8px;
                margin-bottom: 12px;
            }

            .article-item {
                padding: 8px 6px;
            }

            .article-title {
                font-size: 0.88rem;
                line-height: 1.6;
            }

            .section-header {
                margin-bottom: 8px;
                padding-bottom: 8px;
            }

            .section-title {
                font-size: 1.05rem;
            }

            header {
                margin-bottom: 12px;
            }

            .audio-player-bar {
                padding: 8px 10px;
                gap: 8px;
                border-radius: 10px;
                margin-bottom: 14px;
            }

            .audio-player-bar audio {
                height: 28px;
            }

            .audio-player-bar .audio-label {
                font-size: 0.72rem;
            }

            .audio-player-bar .audio-sub {
                font-size: 0.5rem;
            }

            .briefing-toggle summary {
                padding: 10px 12px;
                font-size: 0.82rem;
                border-radius: 10px;
            }

            .briefing-toggle .briefing-content {
                padding: 12px 14px;
            }

            .briefing-content ul li {
                font-size: 0.82rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <span class="logo-icon">📰</span>
                <h1 class="brand">AI Trend Daily</h1>
            </div>
            <div id="date-container">
                <div class="date-box" id="main-date">Loading...</div>
                <div class="header-actions">
                    <button id="history-trigger" class="btn-history" title="지난 동향 보기">📅</button>
                    <!-- Hidden date input -->
                    <input type="date" id="history-date"
                        style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; border: none; padding: 0;">
                </div>
            </div>
        </header>

        <!-- Inline Audio Player -->
        <div class="audio-player-bar">
            <span class="audio-icon">🎙️</span>
            <div class="audio-text">
                <span class="audio-label">오늘의 브리핑</span>
                <span class="audio-sub">백그라운드 재생 지원</span>
            </div>
            <audio id="audioPlayer" controls controlsList="nodownload">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- Briefing Toggle (closed by default) -->
        <details class="briefing-toggle" id="briefing-section">
            <summary>
                <span>🤖</span>
                <span>AI가 작성한 오늘의 3줄 요약</span>
            </summary>
            <div class="briefing-content">
                <ul id="briefingList">
                    <li style="color: #9ca3af;">요약을 불러오는 중...</li>
                </ul>
            </div>
        </details>

        <main id="content-main">
            <div id="loader">
                <div class="spinner"></div>
            </div>
        </main>

        <footer>
            <p id="gemini-footer"></p>
            <p>&copy; Maj.Cjh. All rights reserved</p>
        </footer>
    </div>

    <script>
        let allHistoryData = {};

        async function fetchBriefing() {
            try {
                const response = await fetch(`public/briefing.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('briefing.json 로드 실패');
                const data = await response.json();

                const ul = document.getElementById('briefingList');
                const lines = data.text.split('\n');
                ul.innerHTML = '';

                lines.forEach(line => {
                    const cleanLine = line.trim();
                    if (cleanLine.length > 0) {
                        const li = document.createElement('li');
                        li.textContent = cleanLine.replace(/^[-*•\d\.]+\s*/, '');
                        if (li.textContent.length > 0) {
                            ul.appendChild(li);
                        }
                    }
                });
            } catch (error) {
                console.error('브리핑 로드 실패:', error);
                const ul = document.getElementById('briefingList');
                if (ul) ul.innerHTML = '<li style="color:#9ca3af;">브리핑 데이터를 불러올 수 없습니다.</li>';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // 0. 오디오 플레이어 초기화 (캐시 방지)
            const audioPlayer = document.getElementById('audioPlayer');
            if (audioPlayer) {
                const timestamp = new Date().getTime();
                audioPlayer.src = `public/audio.mp3?t=${timestamp}`;
            }

            // 0-1. briefing.json 로드
            fetchBriefing();

            // 1. data.txt 우선 로드 (최신 데이터 표시)
            fetchLatestText();

            // 2. data.json 로드 (히스토리/달력 초기화용)
            try {
                const response = await fetch('codes/data.json?t=' + new Date().getTime());
                if (!response.ok) return;
                allHistoryData = await response.json();

                const dates = Object.keys(allHistoryData).sort((a, b) => b.localeCompare(a));

                if (dates.length > 0) {
                    const historyDateInput = document.getElementById('history-date');
                    const historyTrigger = document.getElementById('history-trigger');

                    historyTrigger.addEventListener('click', () => {
                        if (typeof historyDateInput.showPicker === 'function') {
                            historyDateInput.showPicker();
                        } else {
                            historyDateInput.click();
                        }
                    });

                    const formattedDates = dates.map(d => '20' + d.replace(/\./g, '-'));
                    historyDateInput.min = formattedDates[formattedDates.length - 1]; // 가장 과거
                    historyDateInput.max = formattedDates[0]; // 가장 최근
                    historyDateInput.value = ""; // 초기값을 비워야 최근 날짜 선택 시에도 change 이벤트가 발생함

                    // renderHistoryDate(dates[0]); // data.txt 우선이므로 최초 렌더링은 제외

                    historyDateInput.addEventListener('change', (e) => {
                        const selectedDate = e.target.value;
                        const key = selectedDate.substring(2).replace(/-/g, '.');
                        if (allHistoryData[key]) {
                            renderHistoryDate(key);
                        } else {
                            alert('해당 날짜의 데이터가 없습니다.');
                        }
                    });
                }
            } catch (error) {
                console.error('History load skip (running on data.txt only):', error);
            }
        });

        async function fetchLatestText() {
            try {
                const response = await fetch('codes/data.txt?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Failed to fetch data.txt');
                const text = await response.text();
                parseAndRender(text);
            } catch (error) {
                console.error(error);
                document.getElementById('content-main').innerHTML = `<p style="text-align:center; color:red;">데이터를 불러오는 중 오류가 발생했습니다.</p>`;
            }
        }

        function renderHistoryDate(dateKey) {
            const data = allHistoryData[dateKey];
            if (!data) return;

            document.getElementById('main-date').innerText = formatHeaderDate(dateKey + " AI 일일 동향");

            // Convert categorized JSON to sections array
            const sections = [];
            const categorized = data.categorized;

            // Order logic: FIXED_CATEGORIES first, then others, then 간행물
            const FIXED_CATEGORIES = ["국방", "육군", "민간", "기관", "해외", "기타"];

            FIXED_CATEGORIES.forEach(cat => {
                if (categorized[cat] && categorized[cat].length > 0) {
                    sections.push({
                        title: cat,
                        articles: categorized[cat].map(a => ({ title: a.title, url: a.link }))
                    });
                }
            });

            Object.keys(categorized).forEach(cat => {
                if (!FIXED_CATEGORIES.includes(cat) && cat !== "간행물") {
                    sections.push({
                        title: cat,
                        articles: categorized[cat].map(a => ({ title: a.title, url: a.link }))
                    });
                }
            });

            if (categorized["간행물"]) {
                sections.push({
                    title: "간행물",
                    articles: categorized["간행물"].map(a => ({ title: a.title, url: a.link }))
                });
            }

            renderContent(sections);
        }

        function parseAndRender(rawText) {
            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0 || l === ''); // empty lines preserved for separator check

            let dateStr = "";
            let currentSection = null;
            let sections = [];

            // First line usually has date
            const dateMatch = lines[0].match(/📢(.*)📢/);
            if (dateMatch) {
                dateStr = dateMatch[1].trim();
                // Add report type if not present
                if (!dateStr.includes('보고')) dateStr += ' ' + getReportType();
            } else {
                dateStr = lines[0].replace(/📢/g, '').trim();
            }
            document.getElementById('main-date').innerText = formatHeaderDate(dateStr);

            let i = 1;
            while (i < lines.length) {
                let line = lines[i];

                // Section Title [Section] or 📚 Section
                if (line.startsWith('[') && line.endsWith(']')) {
                    const title = line.substring(1, line.length - 1);
                    currentSection = { title, articles: [] };
                    sections.push(currentSection);
                } else if (line.startsWith('📚') || line.startsWith('📰') || line.startsWith('🎧')) {
                    const title = line.replace(/📚|📰|🎧/g, '').trim();
                    currentSection = { title, articles: [] };
                    sections.push(currentSection);
                }
                // Article Title ◾
                else if (line.startsWith('◾')) {
                    const title = line.replace('◾', '').trim();
                    const url = lines[i + 1] && lines[i + 1].startsWith('http') ? lines[i + 1].trim() : '#';
                    if (currentSection) {
                        currentSection.articles.push({ title, url });
                    }
                    if (url !== '#') i++; // Skip URL line
                }
                // Footer
                else if (line.startsWith('✅')) {
                    const footer = document.getElementById('gemini-footer');
                    if (footer) footer.innerText = line.replace('✅', '').trim();
                }

                i++;
            }

            renderContent(sections);
        }

        function formatHeaderDate(raw) {
            // Converts "26.03.26 AI 일일 동향" to "'26. 3. 26.(목) 조간보고" style
            let cleaned = raw.replace('AI 일일 동향', '').replace(/📢/g, '').trim();
            const parts = cleaned.split('.').map(p => p.trim());
            if (parts.length >= 3) {
                const year = parts[0];
                const month = parseInt(parts[1]);
                const day = parseInt(parts[2]); // parseInt handles trailing text like "26 AI"

                if (isNaN(month) || isNaN(day)) return raw;

                // Day of week
                const dateObj = new Date(2000 + parseInt(year), month - 1, day);
                const week = ['일', '월', '화', '수', '목', '금', '토'][dateObj.getDay()];

                return `'${year}. ${month}. ${day}.(${week}) ${getReportType()}`;
            }
            return raw;
        }

        function getReportType() {
            return "";
        }

        function getSourceTag(url, title) {
            // Source detection based on URL
            if (url.includes('aikorea.go.kr')) return 'AI전략위';
            if (url.includes('mnd.go.kr')) return '국방부';
            if (url.includes('dapa.go.kr')) return '방사청';
            if (url.includes('msit.go.kr')) return '과기정통부';
            if (url.includes('kookbang.dema.mil.kr')) return '국방일보';
            if (url.includes('etnews.com')) return '전자신문';
            if (url.includes('aitimes.com')) return 'AI타임스';
            if (url.includes('aitimes.kr')) return '인공지능신문';
            if (url.includes('iitp.kr')) return 'IITP';
            if (url.includes('nia.or.kr')) return 'NIA';
            if (url.includes('stepi.re.kr')) return 'STEPI';
            if (url.includes('nipa.kr')) return 'NIPA';
            if (url.includes('kisdi.re.kr')) return 'KISDI';
            if (url.includes('kisti.re.kr')) return 'KISTI';
            if (url.includes('kisa.or.kr')) return 'KISA';
            if (url.includes('tta.or.kr')) return 'TTA';

            // Extract from title bracket [Tag] Title
            const bracketMatch = title.match(/^\[(.*?)\]/);
            if (bracketMatch) return bracketMatch[1];

            // Generic domain extraction
            try {
                const domain = new URL(url).hostname.replace('www.', '');
                return domain.split('.')[0].toUpperCase();
            } catch (e) {
                return '뉴스';
            }
        }

        function renderContent(sections) {
            const main = document.getElementById('content-main');
            main.innerHTML = '';

            sections.forEach(section => {
                if (section.articles.length === 0) return;

                const sectionEl = document.createElement('div');
                sectionEl.className = 'section-card';

                let sectionTitle = section.title;

                sectionEl.innerHTML = `
                    <div class="section-header">
                        <div class="section-bar"></div>
                        <div class="section-title">${sectionTitle}</div>
                    </div>
                    <div class="articles-list">
                        ${section.articles.map(art => `
                            <a href="${art.url}" class="article-item" target="_blank">
                                <div class="article-content">
                                    <div class="article-title">${art.title}</div>
                                    <div class="article-footer">
                                        <div class="article-tag">${getSourceTag(art.url, art.title)}</div>
                                        <div class="article-link">확인</div>
                                    </div>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                `;
                main.appendChild(sectionEl);
            });
        }
    </script>
</body>

</html>
